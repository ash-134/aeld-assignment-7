name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-assignment-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Unit Tests and Verify Part 2 Deliverables
        run: |
          ./unit-test.sh
          test -f assignments/assignment7/faulty-oops.md
          test -f base_external/package/ldd/ldd.mk
          test -f base_external/package/ldd/Config.in
          test -x base_external/rootfs_overlay/etc/init.d/S98lddmodules
          echo "Assignment 7 Part 1 & Part 2 全部 100% 驗證通過！"
