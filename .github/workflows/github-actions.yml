name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Circular Buffer Unit Tests
        run: |
          ./unit-test.sh
          echo "Assignment 7 Part 1 環狀緩衝區單元測試 100% 通過！"
